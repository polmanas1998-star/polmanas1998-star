name: serpent de contributions

on:
  schedule:
    # toutes les 6 heures ; le graphe de contributions bouge rarement plus vite
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generer le serpent
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7f96ff&color_dots=#12100c,#1b2560,#2340a0,#0f2ecf,#7f96ff

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
